<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QuickDo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>QuickDo — 工作記錄</title>
<style>
  :root{
    --paper:#F7F6F1; --card:#FFFFFF; --ink:#1B2A4A; --ink-soft:#5B6B8C; --line:#E8E6DE;
    --accent:#4F46E5; --accent-2:#818CF8; --accent-bg:#EEF0FE;
    --gold:#B07F00; --gold-bg:#FFF6DC;
    --danger:#C2410C; --danger-bg:#FDE8DC; --done:#9AA3B8; --ok:#16A34A;
    --shadow:0 1px 3px rgba(27,42,74,.07), 0 4px 14px rgba(27,42,74,.04);
    --bar:rgba(247,246,241,.97);
  }
  html[data-theme="dark"]{
    --paper:#15171C; --card:#1E222B; --ink:#E9ECF3; --ink-soft:#9AA3B8; --line:#2C313B;
    --accent:#7C84FF; --accent-2:#A5ACFF; --accent-bg:#262A45;
    --gold:#F1C44A; --gold-bg:#332C12;
    --danger:#F08A5D; --danger-bg:#3A241C; --done:#6B7385; --ok:#3DD17A;
    --shadow:0 1px 3px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    --bar:rgba(21,23,28,.97);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{height:100%;-webkit-text-size-adjust:100%}
  body{
    min-height:100%;
    font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--paper); color:var(--ink);
    max-width:560px; margin:0 auto;
    padding:max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 130px max(16px, env(safe-area-inset-left));
    transition:background .2s,color .2s;
    overscroll-behavior-y:contain;            /* 避免下拉整頁重新整理 */
  }
  body.locked{overflow:hidden}
  button{font:inherit;cursor:pointer;touch-action:manipulation}
  input,textarea,select{font:inherit}
  /* 介面按鈕不給長按選字／跳選單，內容文字仍可選取 */
  button,.tab,.chip,.q,.cell,.tick,.num,.dots{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

  header{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  h1{font-size:20px;letter-spacing:.5px;margin-right:auto}
  h1 span{color:var(--accent)}
  #sync-dot{width:8px;height:8px;border-radius:50%;background:#C9CDD8}
  #sync-dot.ok{background:var(--ok)} #sync-dot.err{background:var(--danger)}
  .icon-btn{border:none;background:var(--card);border-radius:11px;box-shadow:var(--shadow);width:38px;height:38px;display:grid;place-items:center;font-size:16px;color:var(--ink-soft)}

  #tabs{display:flex;background:var(--line);border-radius:13px;padding:4px;margin-bottom:14px;gap:2px}
  .tab{flex:1;border:none;background:none;border-radius:10px;padding:10px 0;font-size:13.5px;color:var(--ink-soft);font-weight:500;white-space:nowrap}
  .tab.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

  .panel{display:none}
  .panel.show{display:block}
  #focus-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
  #focus-date{font-size:24px;font-weight:700;line-height:1.2}
  #focus-sub{font-size:13px;color:var(--ink-soft);padding-bottom:3px;margin-right:auto}
  .mini-btn{border:none;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:9px 14px;font-size:13px;color:var(--ink-soft);white-space:nowrap;text-decoration:none;display:inline-block}
  #progress-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:13px 15px;margin-bottom:6px}
  #progress-card .row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:7px}
  #progress-card .row b{color:var(--ink);font-weight:600}
  #load{font-size:12.5px;color:var(--ink-soft)}
  #streak{margin-left:auto;font-size:12.5px;background:var(--gold-bg);color:var(--gold);border-radius:999px;padding:3px 10px;font-weight:600}
  #streak:empty{display:none}
  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease}
  #mood-row{display:flex;align-items:center;gap:2px;margin-top:10px;font-size:12.5px;color:var(--ink-soft)}
  #mood-row span{margin-right:auto}
  .mood{border:none;background:none;font-size:20px;padding:2px 5px;filter:grayscale(1);opacity:.4;transition:transform .12s,opacity .12s}
  .mood:hover{opacity:.8}
  .mood.on{filter:none;opacity:1;transform:scale(1.18)}

  .group{margin-top:16px}
  .group>h2{font-size:12px;font-weight:600;letter-spacing:1.5px;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .group>h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .group>h2.fold{cursor:pointer}
  .group.overdue>h2{color:var(--danger)}
  .item{display:flex;align-items:flex-start;gap:11px;background:var(--card);box-shadow:var(--shadow);border-radius:13px;padding:13px 12px;margin-bottom:8px;border-left:4px solid var(--cat,#C9CDD8)}
  .item:active{transform:scale(.995)}
  .item.new{animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .item.flash{animation:flashring 1.4s ease}
  @keyframes flashring{0%,70%{outline:2.5px solid var(--accent);outline-offset:2px}100%{outline:2.5px solid transparent}}
  .tick{width:27px;height:27px;min-width:27px;margin:-3px -2px -3px -3px;border-radius:9px;border:1.5px solid var(--ink-soft);background:var(--card);position:relative;transition:transform .1s}
  .tick:active{transform:scale(.85)}
  .done>.tick{background:var(--done);border-color:var(--done)}
  .done>.tick::after{content:"";position:absolute;left:8.5px;top:4px;width:7px;height:13px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(40deg)}
  .body{flex:1;min-width:0;cursor:pointer}
  .title{font-size:15.5px;line-height:1.45;word-break:break-word}
  .item.done .title{color:var(--done);text-decoration:line-through}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .tag{font-size:11.5px;border-radius:6px;padding:2px 7px;font-weight:500}
  .tag.user{color:#fff}
  .tag.due{background:var(--line);color:var(--ink-soft)}
  .tag.due.late{background:var(--danger-bg);color:var(--danger);font-weight:600}
  .tag.pri{background:var(--danger-bg);color:var(--danger)}
  .tag.rep{background:var(--accent-bg);color:var(--accent);font-weight:600}
  .tag.goal{background:var(--accent-bg);color:var(--accent)}
  .tag.plan{background:var(--gold-bg);color:var(--gold);font-weight:600}
  .tag.plan.late{background:var(--danger-bg);color:var(--danger)}
  .tag.dur,.tag.chk{background:var(--line);color:var(--ink-soft)}
  .tag.chk.full{color:var(--ok)}
  .tag.note{padding:2px 1px}
  a.tag.lnk{background:var(--line);text-decoration:none}
  .snooze{border:none;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:600;border-radius:8px;padding:6px 12px;margin-top:8px}
  .del{font-size:21px;line-height:1;border:none;background:none;color:#C7C4BB;padding:8px 6px;margin:-8px -6px -8px 0;align-self:flex-start}
  html[data-theme="dark"] .del{color:#454B57}
  .del:hover,.del:focus-visible{color:var(--danger)}
  .empty{text-align:center;color:var(--ink-soft);padding:32px 16px;font-size:14.5px;line-height:1.9}
  .empty .big{font-size:32px;display:block;margin-bottom:6px}
  .empty .quote{font-size:12.5px;opacity:.8;margin-top:8px;font-style:italic}

  #search{width:100%;border:none;box-shadow:var(--shadow);border-radius:12px;background:var(--card);padding:12px 14px;font-size:16px;outline:none;margin-bottom:10px;color:var(--ink)}
  #search:focus{outline:2px solid var(--accent)}
  #filters{display:flex;gap:6px;flex-wrap:wrap;padding:2px}
  .chip{font-size:13.5px;border:none;border-radius:999px;box-shadow:var(--shadow);padding:9px 15px;background:var(--card);color:var(--ink-soft);white-space:nowrap}
  .chip.on{background:var(--ink);color:var(--paper)}


  /* ===== 週計畫 ===== */
  #week-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  #week-title{font-size:20px;font-weight:700;margin-right:auto}
  .tray{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px;margin-bottom:12px}
  .tray h3{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tray h3.fold{cursor:pointer}
  .tray .hint{margin-left:auto;font-weight:400;font-size:11.5px;opacity:.85}
  .tray-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;max-height:210px;overflow-y:auto;padding:2px}
  .tray-list .mini{flex:1 1 230px;margin:0}
  .week-grid{display:flex;flex-direction:column;gap:10px}
  .day{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 10px 6px;border-top:3px solid transparent}
  .day.today{border-top-color:var(--accent)}
  .day-head{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:2px 0 7px;cursor:pointer}
  .day.today .day-head b{color:var(--accent)}
  .dmood{font-size:15px}
  .dsum{margin-left:auto;font-size:12px;color:var(--ink-soft)}
  .day.heavy .dsum{color:var(--danger);font-weight:600}
  .day-empty{font-size:12px;color:var(--ink-soft);opacity:.55;padding:2px 2px 6px}
  .mini{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border-radius:9px;padding:7px 8px;margin-bottom:5px;border-left:3px solid var(--cat,#C9CDD8)}
  .mini .tick{width:20px;height:20px;min-width:20px;border-radius:6px;margin:0}
  .mini.done>.tick::after{left:5.5px;top:2px;width:5px;height:10px;border-width:0 2px 2px 0}
  .mini .title{font-size:13.5px;line-height:1.4}
  .mini.done .title{color:var(--done);text-decoration:line-through}
  .mini.late{box-shadow:inset 0 0 0 1.5px var(--danger-bg)}
  .mmeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  [draggable="true"]{cursor:grab}
  .dragging{opacity:.35}
  .dz.over{outline:2px dashed var(--accent);outline-offset:2px}

  /* ===== 目標 ===== */
  #memo-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .memo-head{width:100%;border:none;background:none;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-size:14.5px;font-weight:600;color:var(--ink)}
  .memo-head span{font-weight:400;color:var(--ink-soft);font-size:12.5px}
  #memo-text{display:block;width:calc(100% - 20px);margin:0 10px 10px;min-height:300px;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.75;outline:none;resize:vertical}
  #memo-text:focus{border-color:var(--accent)}
  .goal-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:13px 14px;margin-bottom:10px;cursor:pointer}
  .goal-card:active{transform:scale(.995)}
  .g-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .g-emoji{font-size:22px;line-height:1}
  .g-title{font-weight:700;font-size:15.5px;flex:1;min-width:0;line-height:1.4}
  .g-pct{font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .g-next{font-size:13.5px;background:var(--gold-bg);border-radius:9px;padding:7px 10px;margin-bottom:9px;line-height:1.55}
  .g-meta{font-size:12px;color:var(--ink-soft);margin-top:7px;line-height:1.5}
  .add-goal{width:100%;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:14px;color:var(--ink-soft);font-size:14px;margin-top:2px}

  /* ===== 日曆 ===== */
  #cal-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 12px}
  #cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  #cal-title{font-size:15.5px;font-weight:700;margin-right:auto}
  .nav-btn{border:1px solid var(--line);background:var(--card);border-radius:9px;width:30px;height:30px;color:var(--ink-soft)}
  #cal-today-btn{border:1px solid var(--line);background:var(--card);border-radius:9px;height:30px;padding:0 11px;font-size:12.5px;color:var(--ink-soft)}
  #cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;user-select:none}
  .wd{font-size:11px;color:var(--ink-soft);text-align:center;padding:4px 0;font-weight:600}
  .cell{aspect-ratio:1/1.05;min-height:44px;border-radius:10px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:3px;gap:4px;font-size:14.5px;color:var(--ink);position:relative}
  .cell.dim{color:var(--ink-soft);opacity:.5}
  .cell.today .num{background:var(--ink);color:var(--paper);border-radius:50%}
  .cell.sel{background:var(--accent-bg);outline:1.5px solid var(--accent)}
  .num{width:27px;height:27px;display:grid;place-items:center;line-height:1}
  .dots{display:flex;gap:2.5px;height:6px}
  .dot{width:5px;height:5px;border-radius:50%}
  .cmood{position:absolute;top:1px;right:1px;font-size:10px;line-height:1}
  #cal-hint{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:10px}

  /* ===== 輸入區（收合式）===== */
  #capture{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px max(14px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));z-index:20;will-change:transform}
  body.kb #capture{padding-bottom:9px}          /* 鍵盤升起時不需要 home bar 留白 */
  body.kb #options.open{max-height:30vh}
  #options{max-height:0;overflow:hidden;transition:max-height .22s ease}
  #options.open{max-height:46vh;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
  #tag-row{display:flex;gap:6px;flex-wrap:wrap;padding:2px;margin-bottom:6px}
  #ctrl-row{display:flex;gap:6px;flex-wrap:wrap;padding:2px}
  .q{font-size:13.5px;border:none;box-shadow:var(--shadow);border-radius:999px;padding:9px 14px;background:var(--card);color:var(--ink-soft);white-space:nowrap}
  .q.on{color:#fff;background:var(--ink)}
  .q.on#q-pri{background:var(--danger)} .q.on#q-rep,.q.on#q-goal{background:var(--accent)}
  #form{display:flex;gap:8px;align-items:center}
  #opts-toggle{border:none;background:var(--card);box-shadow:var(--shadow);border-radius:11px;width:46px;height:46px;min-width:46px;font-size:17px;color:var(--ink-soft);position:relative}
  #opts-toggle.on{background:var(--ink);color:var(--paper)}
  #opts-toggle .badge{position:absolute;top:-3px;right:-3px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
  #input{flex:1;font-size:16px;border:none;box-shadow:var(--shadow);border-radius:12px;padding:13px 14px;background:var(--card);color:var(--ink);outline:none;min-width:0}
  #input:focus{outline:2px solid var(--accent)}
  #submit-btn{font-size:15px;font-weight:600;border:none;border-radius:12px;padding:0 18px;height:46px;min-width:66px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
  #submit-btn:active{transform:scale(.96)}
  #parse-hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;min-height:0;line-height:1.5}
  #parse-hint b{color:var(--accent)}
  #date-input,#time-input{position:absolute;width:0;height:0;opacity:0;pointer-events:none}

  /* ===== 彈窗 ===== */
  #overlay{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
  #overlay.show{display:flex}
  #modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:14px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;color:var(--ink);transition:transform .18s ease}
  #modal::before{content:"";display:block;width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
  #overlay.show #modal{animation:sheetup .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes sheetup{from{transform:translateY(24px)}to{transform:none}}
  #modal h2{font-size:17px;margin-bottom:6px}
  #modal h3{font-size:13.5px;color:var(--ink-soft);margin:16px 0 8px;font-weight:600}
  #modal label{font-size:13px;color:var(--ink-soft);display:block;margin:12px 0 5px}
  #modal input[type=text],#modal input[type=number],#modal input[type=date],#modal input[type=time],#modal textarea,#modal select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;outline:none;font-size:16px;background:var(--paper);color:var(--ink)}
  #modal textarea{line-height:1.65;resize:vertical;font-size:15px}
  #modal input:focus,#modal textarea:focus,#modal select:focus{border-color:var(--accent)}
  #modal .row{display:flex;gap:8px;align-items:center;margin-top:6px}
  #modal .row input{flex:1;min-width:0}
  #modal .two{display:flex;gap:8px} #modal .two>div{flex:1;min-width:0}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .seg button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:9px;padding:10px 13px;font-size:14px}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .swatches,.emojis{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
  .swatch.on{border-color:var(--ink)}
  .tag-pick,.tag-manage{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .tg{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:9px 14px;font-size:13.5px;color:#fff}
  .tg .x{font-weight:700;opacity:.85}
  .tg.confirm{outline:2px solid var(--danger);outline-offset:1px}
  .modal-btns{display:flex;gap:8px;margin-top:18px}
  .modal-btns button{flex:1;border-radius:11px;padding:14px 12px;font-size:15px;font-weight:600;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft)}
  .modal-btns .primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .modal-btns .warn{color:var(--danger);border-color:var(--danger-bg);background:var(--danger-bg)}
  #modal details{margin-top:14px;font-size:13px;color:var(--ink-soft);line-height:1.7}
  #modal summary{cursor:pointer;font-weight:600}
  #modal pre{background:var(--paper);border-radius:8px;padding:10px;font-size:11.5px;overflow-x:auto;margin:8px 0;line-height:1.5}
  #modal code{background:var(--paper);border-radius:5px;padding:1px 6px;font-size:12.5px}
  #modal .note{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.6}
  #sync-msg,#data-msg{font-size:13px;margin-top:10px;min-height:18px;line-height:1.6}
  #sync-msg.ok,#data-msg.ok{color:var(--ok)} #sync-msg.err,#data-msg.err{color:var(--danger)}
  .help-sec{margin-top:14px;font-size:14px;line-height:1.85;color:var(--ink)}
  .help-sec h3{font-size:14.5px;color:var(--ink) !important;margin:14px 0 4px !important;font-weight:700 !important}
  .help-sec p{margin:4px 0}
  .ck-row,.g-task{display:flex;align-items:flex-start;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
  .ck{width:21px;height:21px;min-width:21px;border-radius:6px;border:1.5px solid var(--ink-soft);background:var(--card);position:relative;margin-top:1px}
  .done>.ck{background:var(--done);border-color:var(--done)}

<body>

<script>
/* ===================== 儲存層 ===================== */
const Local = {
  async get(key, fb) {
    if (window.storage) { try { const r = await window.storage.get('quickdo-'+key); return JSON.parse(r.value); } catch(e){ return fb; } }
    try { const v = localStorage.getItem('quickdo-'+key); return v ? JSON.parse(v) : fb; } catch(e){ return fb; }
  },
  async set(key, val) {
    const data = JSON.stringify(val);
    if (window.storage) { try { await window.storage.set('quickdo-'+key, data); } catch(e){ console.error(e); } }
    else { try { localStorage.setItem('quickdo-'+key, data); } catch(e){ console.error(e); } }
  }
};
/* ===================== 雲端層 ===================== */
const Cloud = {
  cfg:{url:'',key:''},
  get enabled(){ return !!(this.cfg.url && this.cfg.key); },
  headers(){ return {'apikey':this.cfg.key,'Authorization':'Bearer '+this.cfg.key,'Content-Type':'application/json'}; },
  endpoint(){ return this.cfg.url.replace(/\/+$/,'')+'/rest/v1/quickdo'; },
  async pull(){ const r = await fetch(this.endpoint()+'?select=*',{headers:this.headers()}); if(!r.ok) throw new Error('pull '+r.status); return r.json(); },
  async push(rows){ if(!rows.length) return; const r = await fetch(this.endpoint(),{method:'POST',headers:{...this.headers(),'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(rows)}); if(!r.ok) throw new Error('push '+r.status); }
};
const setSyncDot = s => document.getElementById('sync-dot').className = s;

/* ===================== 狀態 ===================== */
const TAG_COLORS = ['#4F46E5','#D97706','#0D9488','#DB2777','#7C3AED','#0891B2','#65A30D','#E11D48','#A16207','#475569'];
const MOODS = ['😡','😞','😐','🙂','🤩'];
let tasks=[], tags=[], goals=[], moods={}, memo={text:'',upd:0}, logs=[], timer=null, revealNext=true, logDay=null;
let filter='all', view='today', searchQ='';
let focusTs=null, weekTs=null, pendingPush=[], calMonth, lastAddedId=null, memoOpen=false;
const openGroups=new Set();

/* ===================== 日期工具 ===================== */
const dayMs=86400000;
const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
const todayTs = () => startOfDay(new Date());
const mondayOf = ts => { const d=new Date(ts); return startOfDay(new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7))); };
const WD='日一二三四五六';
function fmtDue(ts){
  const diff=Math.round((ts-todayTs())/dayMs);
  if(diff===0)return'今天'; if(diff===1)return'明天'; if(diff===2)return'後天'; if(diff===-1)return'昨天';
  const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} 週${WD[d.getDay()]}`;
}
const fmtMD = ts => { const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtTime = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const fmtFull = t => t.due==null?'':fmtDue(t.due)+(t.dueEnd!=null?'–'+fmtMD(t.dueEnd):'')+(t.time!=null?' '+fmtTime(t.time):'');
const fmtDur = m => m<60?`${m}m`:`${+(m/60).toFixed(1)}h`;
const toInput = ts => { if(ts==null)return''; const d=new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fromInput = v => v?startOfDay(new Date(v+'T00:00')):null;
/* 「哪天做」優先，沒排就看截止日 */
const when = t => t.plan ?? t.due;
const whenEnd = t => t.plan ?? t.dueEnd ?? t.due;
const isOverdue = t => !t.done && whenEnd(t)!=null && whenEnd(t)<todayTs();
const REP_LABEL = { daily:'每天', weekly:'每週', monthly:'每月' };
function advance(due, repeat){
  if(repeat==='daily')   return due+dayMs;
  if(repeat==='weekly')  return due+7*dayMs;
  if(repeat==='monthly'){ const d=new Date(due); d.setMonth(d.getMonth()+1); return startOfDay(d); }
  return null;
}
function cnum(s){
  if(/^[0-9０-９]+$/.test(s)) return +s.replace(/[０-９]/g,c=>'０１２３４５６７８９'.indexOf(c));
  const M={零:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
  if(s.length===1) return M[s]??NaN;
  if(s[0]==='十') return 10+(M[s[1]]??0);
  if(s[1]==='十') return M[s[0]]*10+(s[2]?M[s[2]]??0:0);
  return NaN;
}
const NUM='0-9０-９一二兩三四五六七八九十';

/* ===================== 智慧解析 ===================== */
function parse(raw){
  let text=' '+raw.trim()+' ';
  const r={title:'',due:null,time:null,pri:false,repeat:null,tags:[],duration:null,goal:null};
  text=text.replace(/#(\S+)/g,(m,w)=>{r.tags.push(w);return' ';});
  text=text.replace(/@(\S+)/g,(m,w)=>{const g=findGoal(w);if(g){r.goal=g.id;return' ';}return m;});
  if(/[!！]/.test(text)){r.pri=true;text=text.replace(/[!！]+/g,' ');}

  // 重複（先抓，保留週幾讓日期規則處理）
  if(/每天|每日/.test(text)){ r.repeat='daily'; text=text.replace(/每天|每日/,'今天'); }
  else if(/每個?月/.test(text)){ r.repeat='monthly'; text=text.replace(/每個?/g,' '); }
  else if(/每(週|周|星期|禮拜)/.test(text)){ r.repeat='weekly'; text=text.replace(/每/g,' '); }

  const now=new Date(), dow=now.getDay();
  const wdIdx=c=>WD.indexOf(c==='天'?'日':c);
  const nextWeekDay=(target,weeksAhead)=>{ let dToMon=(8-(dow===0?7:dow))%7; if(dToMon===0)dToMon=7; return todayTs()+(dToMon+(weeksAhead-1)*7+(target+6)%7)*dayMs; };

  let m=text.match(new RegExp(`(半|[${NUM}]{1,3})\\s*(?:個)?(小時|鐘頭|分鐘)[後后]`));
  if(m){ const n=m[1]==='半'?0.5:cnum(m[1]); if(!isNaN(n)){ const delta=m[2]==='分鐘'?n:n*60; let total=now.getHours()*60+now.getMinutes()+Math.round(delta); let off=0; while(total>=1440){total-=1440;off++;} r.due=todayTs()+off*dayMs; r.time=total; text=text.replace(m[0],' '); } }

  // 預估時間：2h、1.5小時、30m、45分鐘、半小時（後面沒有「後」才算）
  let dm=text.match(/(\d+(?:\.\d+)?)\s*(?:hrs|hr|h|個?小時|個?鐘頭)(?![a-zA-Z後后])/);
  if(dm){ r.duration=Math.round(parseFloat(dm[1])*60); text=text.replace(dm[0],' '); }
  else if((dm=text.match(/半個?小時(?![後后])/))){ r.duration=30; text=text.replace(dm[0],' '); }
  else if((dm=text.match(/(\d+)\s*(?:mins|min|m|分鐘)(?![a-zA-Z後后])/))){ r.duration=+dm[1]; text=text.replace(dm[0],' '); }

  if(r.due==null){
    const rules=[
      [new RegExp(`下下(?:週|周|星期|禮拜)([一二三四五六日天])`),m=>nextWeekDay(wdIdx(m[1]),2)],
      [new RegExp(`下(?:週|周|星期|禮拜)([一二三四五六日天])`),m=>nextWeekDay(wdIdx(m[1]),1)],
      [new RegExp(`(?:週|周|星期|禮拜)([一二三四五六日天])`),m=>{let diff=(wdIdx(m[1])-dow+7)%7;if(diff===0)diff=7;return todayTs()+diff*dayMs;}],
      [/下週末|下周末/,()=>nextWeekDay(6,1)],
      [/週末|周末/,()=>todayTs()+((6-dow+7)%7)*dayMs],
      [/下下個?月底/,()=>startOfDay(new Date(now.getFullYear(),now.getMonth()+3,0))],
      [/下個?月底/,()=>startOfDay(new Date(now.getFullYear(),now.getMonth()+2,0))],
      [/月底/,()=>startOfDay(new Date(now.getFullYear(),now.getMonth()+1,0))],
      [new RegExp(`下下個?月([${NUM}]{1,3})[號日]`),m=>{const n=cnum(m[1]);return n?startOfDay(new Date(now.getFullYear(),now.getMonth()+2,n)):null;}],
      [new RegExp(`下個?月([${NUM}]{1,3})[號日]`),m=>{const n=cnum(m[1]);return n?startOfDay(new Date(now.getFullYear(),now.getMonth()+1,n)):null;}],
      [new RegExp(`明年([${NUM}]{1,3})月([${NUM}]{1,3})[日號]?`),m=>{const mo=cnum(m[1]),da=cnum(m[2]);return(mo&&da)?startOfDay(new Date(now.getFullYear()+1,mo-1,da)):null;}],
      [new RegExp(`([${NUM}]{1,3})月([${NUM}]{1,3})[日號]?`),m=>{const mo=cnum(m[1]),da=cnum(m[2]);if(!mo||!da)return null;let d=new Date(now.getFullYear(),mo-1,da);if(startOfDay(d)<todayTs()-30*dayMs)d.setFullYear(d.getFullYear()+1);return startOfDay(d);}],
      [/(20\d{2})[\/\-](\d{1,2})[\/\-](\d{1,2})/,m=>startOfDay(new Date(+m[1],+m[2]-1,+m[3]))],
      [/(\d{1,2})\/(\d{1,2})/,m=>{let d=new Date(now.getFullYear(),+m[1]-1,+m[2]);if(startOfDay(d)<todayTs()-30*dayMs)d.setFullYear(d.getFullYear()+1);return startOfDay(d);}],
      [new RegExp(`(?:這個?月)?([${NUM}]{1,3})[號](?![${NUM}])`),m=>{const n=cnum(m[1]);if(!n||n>31)return null;let ts=startOfDay(new Date(now.getFullYear(),now.getMonth(),n));if(ts<todayTs())ts=startOfDay(new Date(now.getFullYear(),now.getMonth()+1,n));return ts;}],
      [new RegExp(`([${NUM}]{1,3})天[後后]`),m=>{const n=cnum(m[1]);return n?todayTs()+n*dayMs:null;}],
      [/大後天/,()=>todayTs()+3*dayMs],[/後天/,()=>todayTs()+2*dayMs],
      [/明天|明早|明晚/,()=>todayTs()+dayMs],[/今天|今晚|今早/,()=>todayTs()],
    ];
    for(const [re,fn] of rules){ const mm=text.match(re); if(mm){ const ts=fn(mm); if(ts!=null){ r.due=ts; let rep=' '; if(/晚$/.test(mm[0]))rep=' 晚上'; if(/早$/.test(mm[0]))rep=' 早上'; text=text.replace(re,rep); break; } } }
  }
  // 每月/每週沒指定日 → 預設今天起算
  if(r.repeat&&r.due==null) r.due=todayTs();

  const pm2=text.match(/凌晨|清晨|一早|早上|上午|中午|下午|傍晚|晚上|晚間|深夜/);
  const period=pm2?pm2[0]:null;
  const isPM=p=>/中午|下午|傍晚|晚上|晚間|深夜/.test(p);
  if(r.time==null){
    let tm=text.match(/(?<![\d\/.])([01]?\d|2[0-3]):([0-5]\d)(?!\d)/);
    if(tm){ let h=+tm[1]; if(period&&isPM(period)&&h<12)h+=12; r.time=h*60+(+tm[2]); text=text.replace(tm[0],' '); }
    else if((tm=text.match(/(\d{1,2})\s*(am|pm|AM|PM)/))){ let h=+tm[1]%12; if(/pm/i.test(tm[2]))h+=12; r.time=h*60; text=text.replace(tm[0],' '); }
    else if((tm=text.match(new RegExp(`([${NUM}]{1,3})\\s*[點:：時]\\s*(半|[${NUM}]{1,3}\\s*分)?`)))){ let h=cnum(tm[1]); if(!isNaN(h)&&h<=24){ let mi=0; if(tm[2]==='半')mi=30; else if(tm[2]){const n=cnum(tm[2].replace(/分|\s/g,''));if(!isNaN(n))mi=n;} if(period&&isPM(period)&&h<12)h+=12; if(period&&/凌晨|清晨|深夜/.test(period)&&h===12)h=0; r.time=(h%24)*60+mi; text=text.replace(tm[0],' '); } }
    else if(period){ const def={凌晨:360,清晨:360,一早:480,早上:540,上午:600,中午:720,下午:900,傍晚:1080,晚上:1260,晚間:1260,深夜:1380}; r.time=def[period]; }
  }
  if(period) text=text.replace(period,' ');
  if(r.time!=null&&r.due==null) r.due=todayTs();
  r.title=text.replace(/\s+/g,' ').trim();
  return r;
}

const $hint=document.getElementById('parse-hint');
document.getElementById('input').addEventListener('input',e=>{
  const v=e.target.value.trim();
  if(!v){$hint.textContent='';return;}
  const p=parse(v); const bits=[];
  if(p.repeat) bits.push(`<b>${REP_LABEL[p.repeat]}</b>`);
  if(p.due!=null) bits.push(`<b>${fmtDue(p.due)}${p.time!=null?' '+fmtTime(p.time):''}</b>`);
  if(p.duration) bits.push(`<b>⏱ ${fmtDur(p.duration)}</b>`);
  if(p.goal){ const g=goalById(p.goal); if(g) bits.push(`<b>${esc(g.emoji||'🎯')} ${esc(shortTitle(g))}</b>`); }
  if(p.tags.length) bits.push(p.tags.map(t=>'#'+esc(t)).join(' '));
  if(p.pri) bits.push('<b>重要</b>');
  $hint.innerHTML=bits.length?'將記為：'+bits.join(' ・ '):'';
});

/* ===================== 標籤 ===================== */
const liveTags = () => tags.filter(t=>!t.del);
const tagUse = name => tasks.filter(t=>!t.deleted&&(t.tags||[]).includes(name)).length;
const liveTagsSorted = () => [...liveTags()].sort((a,b)=>tagUse(b.name)-tagUse(a.name));
function tagColor(name){ const t=tags.find(x=>x.name===name&&!x.del); if(t)return t.color; let h=0; for(const c of name)h=(h*31+c.charCodeAt(0))>>>0; return TAG_COLORS[h%TAG_COLORS.length]; }
async function ensureTag(name,color){
  name=name.trim().replace(/^#/,''); if(!name)return;
  const exist=tags.find(t=>t.name===name);
  if(exist){ if(exist.del){exist.del=false;exist.upd=Date.now();if(color)exist.color=color;} else return; }
  else tags.push({name,color:color||tagColor(name),del:false,upd:Date.now()});
  await Local.set('tags',tags); queuePush(tagsRow());
}
async function deleteTag(name){
  const t=tags.find(x=>x.name===name); if(!t)return;
  t.del=true; t.upd=Date.now();
  for(const task of tasks){ if(task.tags&&task.tags.includes(name)){ task.tags=task.tags.filter(n=>n!==name); task.updated=Date.now(); queuePush(taskRow(task)); } }
  composer.tags.delete(name); if(filter===name)filter='all';
  await Local.set('tags',tags); await Local.set('tasks',tasks); queuePush(tagsRow());
}
const itemColor = t => (t.tags&&t.tags.length)?tagColor(t.tags[0]):'#C9CDD8';

/* ===================== 目標 ===================== */
const liveGoals = () => goals.filter(g=>!g.deleted);
const shortTitle = g => g.title.split(/[（(]/)[0].trim()||g.title;
const goalById = id => id?goals.find(g=>g.id===id&&!g.deleted)||null:null;
function findGoal(w){ w=w.toLowerCase(); return liveGoals().find(g=>g.title.toLowerCase().includes(w))||null; }
function goalStats(g){
  const ts=alive().filter(t=>t.goalId===g.id); const st=g.steps||[];
  const total=ts.length+st.length, done=ts.filter(t=>t.done).length+st.filter(s=>s.done).length;
  const next=ts.filter(t=>!t.done&&t.due!=null&&(t.dueEnd??t.due)>=todayTs()).sort((a,b)=>a.due-b.due)[0]||null;
  return {ts,total,done,next};
}
function newGoal(title,emoji){ const now=Date.now(); return {id:'g'+now+Math.random().toString(36).slice(2,5),emoji:emoji||'🎯',title,next:'',steps:[],note:'',link:'',created:now,updated:now,deleted:false}; }
async function persistGoal(g){ await Local.set('goals',goals); queuePush(goalRow(g)); }
const goalTimers={};
function persistGoalSoon(g){ clearTimeout(goalTimers[g.id]); goalTimers[g.id]=setTimeout(()=>persistGoal(g),600); }
let memoTimer=null;
function saveMemoSoon(){ clearTimeout(memoTimer); memoTimer=setTimeout(async()=>{ await Local.set('memo',memo); queuePush(memoRow()); },700); }

/* ===================== 共用 ===================== */
const esc = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safeUrl = u => /^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'';
const alive = () => tasks.filter(t=>!t.deleted);
const matchTag = (t,f) => f==='all'||(t.tags||[]).includes(f);
const sortDay = (a,b)=>(a.done-b.done)||(b.pri-a.pri)||((a.time??9999)-(b.time??9999))||(a.created-b.created);
const sortDue = (a,b)=>(b.pri-a.pri)||((a.due??9e15)-(b.due??9e15))||((a.time??9999)-(b.time??9999))||(a.created-b.created);
const sortWhen = (a,b)=>((when(a)??9e15)-(when(b)??9e15))||sortDue(a,b);

function itemHTML(t,drag){
  const late=t.due!=null&&(t.dueEnd??t.due)<todayTs()&&!t.done;
  const planLate=!t.done&&t.plan!=null&&t.plan<todayTs();
  const showPlan=t.plan!=null&&t.plan!==t.due;
  const g=goalById(t.goalId); const ck=t.checks||[]; const ckDone=ck.filter(c=>c.done).length;
  const link=safeUrl(t.link);
  return `
  <div class="item ${t.done?'done':''} ${t.id===lastAddedId?'new':''}" data-id="${t.id}" style="--cat:${itemColor(t)}"${drag?' draggable="true"':''}>
    <button class="tick" aria-label="${t.done?'標記未完成':'標記完成'}"></button>
    <div class="body" title="點一下編輯">
      <div class="title"><span>${esc(t.title)}</span></div>
      <div class="meta">
        ${g?`<span class="tag goal">${esc(g.emoji||'🎯')} ${esc(shortTitle(g))}</span>`:''}
        ${(t.tags||[]).map(n=>`<span class="tag user" style="background:${tagColor(n)}">#${esc(n)}</span>`).join('')}
        ${t.repeat?`<span class="tag rep">🔁 ${REP_LABEL[t.repeat]}</span>`:''}
        ${showPlan?`<span class="tag plan ${planLate?'late':''}">🗓 ${fmtDue(t.plan)}做</span>`:''}
        ${t.due!=null?`<span class="tag due ${late?'late':''}">${showPlan?'⏰ ':''}${fmtFull(t)}</span>`:''}
        ${t.duration?`<span class="tag dur">⏱ ${fmtDur(t.duration)}</span>`:''}
        ${ck.length?`<span class="tag chk ${ckDone===ck.length?'full':''}">☑ ${ckDone}/${ck.length}</span>`:''}
        ${t.pri?`<span class="tag pri">重要</span>`:''}
        ${t.note?`<span class="tag note" title="${esc(t.note)}">📝</span>`:''}
        ${link?`<a class="tag lnk" href="${esc(link)}" target="_blank" rel="noopener" title="開啟連結">🔗</a>`:''}
      </div>
      ${isOverdue(t)?`<button class="snooze" data-snooze="${t.id}">${late?'順延到今天':'改排今天'} →</button>`:''}
    </div>
    <button class="del" aria-label="刪除">×</button>
  </div>`;
}
function miniHTML(t){
  const g=goalById(t.goalId);
  const bits=[t.time!=null?fmtTime(t.time):'', t.duration?'⏱'+fmtDur(t.duration):'', t.plan!=null&&t.due!=null&&t.plan!==t.due?'⏰'+fmtMD(t.due):'', isOverdue(t)&&t.due!=null?'逾期 '+fmtMD(t.due):''].filter(Boolean).join(' ・ ');
  return `<div class="mini ${t.done?'done':''} ${isOverdue(t)?'late':''}" data-id="${t.id}" style="--cat:${itemColor(t)}"${isDesktop()?' draggable="true"':''}><button class="tick" aria-label="${t.done?'標記未完成':'標記完成'}"></button><div class="body"><div class="title"><span>${g?esc(g.emoji||'🎯')+' ':''}${esc(t.title)}</span></div>${bits?`<div class="mmeta">${bits}</div>`:''}</div></div>`;
}
function groupHTML(key,title,arr,cls='',fold=true,alwaysFold=false){
  const canFold=fold&&(alwaysFold||arr.length>5); const open=!canFold||openGroups.has(key);
  return `<section class="group ${cls}"><h2${canFold?` class="fold" data-fold="${key}"`:''}>${title} ・ ${arr.length}${canFold?` ${open?'▾':'▸ 點開'}`:''}</h2>${open?arr.map(t=>itemHTML(t)).join(''):''}</section>`;
}
const QUOTES=['「先完成，再完美。」','「小步前進也是前進。」','「今天的努力，是明天的禮物。」','「做就對了。」','「你能搞定的。」'];
const emptyHTML = (msg,icon='🌤️') => `<div class="empty"><span class="sp"><span class="big">${icon}</span><i style="left:-16px;top:4px">✦</i><i style="right:-14px;top:-4px;animation-delay:.6s">✦</i><i style="right:-20px;bottom:4px;animation-delay:1.2s">✧</i></span><br>${msg}<div class="quote">${QUOTES[Math.floor(Math.random()*QUOTES.length)]}</div></div>`;

function streak(){
  const days=new Set(alive().filter(t=>t.done&&t.doneAt!=null).map(t=>t.doneAt));
  let n=0,d=todayTs(); if(!days.has(d))d-=dayMs;
  while(days.has(d)){n++;d-=dayMs;} return n;
}

/* ===================== 焦點面板 ===================== */
function renderFocus(){
  if(focusTs==null)focusTs=todayTs();
  const isToday=focusTs===todayTs();
  const d=new Date(focusTs), h=new Date().getHours();
  const greet=h<5?'夜深了，早點休息 🌙':h<11?'早安！☀️':h<14?'午安！':h<18?'下午好！':'晚安 🌙';
  document.getElementById('focus-date').textContent=isToday?`今天 ・ ${d.getMonth()+1}月${d.getDate()}日`:`${d.getMonth()+1}月${d.getDate()}日 週${WD[d.getDay()]}`;
  document.getElementById('focus-sub').textContent=isToday?`週${WD[d.getDay()]}，${greet}`:'從日曆選的日子，輸入會直接記到這天';
  document.getElementById('btn-back-today').style.display=isToday?'none':'';
  const dueList=alive().filter(t=>when(t)===focusTs);
  const doneN=dueList.filter(t=>t.done).length;
  document.getElementById('progress-n').textContent=dueList.length?`${doneN} / ${dueList.length}`:'尚無安排';
  document.getElementById('progress-fill').style.width=dueList.length?(doneN/dueList.length*100)+'%':'0%';
  const mins=dueList.filter(t=>!t.done).reduce((s,t)=>s+(t.duration||0),0);
  document.getElementById('load').textContent=mins?`・ 預估 ${fmtDur(mins)}`:'';
  const st=streak();
  document.getElementById('streak').textContent=st>0?`🔥 連續 ${st} 天`:'';
  renderMood();
  const pending=dueList.filter(t=>!t.done).sort(sortDay);
  const doneList=alive().filter(t=>t.done&&(when(t)===focusTs||t.doneAt===focusTs)).sort((a,b)=>b.updated-a.updated);
  let html='';
  if(isToday){ const overdue=alive().filter(isOverdue).sort(sortWhen); if(overdue.length)html+=groupHTML('overdue','已逾期／延宕',overdue,'overdue'); }
  html+=`<section class="group"><h2>${isToday?'今天':'當天待辦'}</h2>${pending.length?pending.map(t=>itemHTML(t)).join(''):(doneList.length?`<div class="empty" style="padding:18px">這天的事都完成了 ✨</div>`:emptyHTML('還沒有安排，從輸入框記一筆吧'))}</section>`;
  if(isToday){ const noDate=alive().filter(t=>!t.done&&when(t)==null).sort(sortDue); if(noDate.length)html+=groupHTML('nodate','未排程',noDate); }
  // 完成的事預設收起來，要取消勾選時再點開
  if(doneList.length)html+=groupHTML('done','已完成',doneList,'',true,true);
  document.getElementById('focus-list').innerHTML=html;
  renderLog();
}

/* ===================== 週計畫 ===================== */
function renderWeek(){
  if(weekTs==null)weekTs=mondayOf(focusTs??todayTs());
  document.getElementById('week-title').textContent=`${fmtMD(weekTs)} – ${fmtMD(weekTs+6*dayMs)}`;
  document.getElementById('week-this').style.display=weekTs===mondayOf(todayTs())?'none':'';
  const tray=alive().filter(t=>!t.done&&(when(t)==null||isOverdue(t))).sort((a,b)=>(isOverdue(b)-isOverdue(a))||sortWhen(a,b));
  const canFold=tray.length>8, trayOpen=!canFold||openGroups.has('tray');
  let html=`<section class="tray dz" data-ts=""><h3${canFold?' class="fold" data-fold="tray"':''}>📥 待排入（未排程＋逾期）・ ${tray.length}${canFold?` ${trayOpen?'▾':'▸ 點開'}`:''}<span class="hint">${isDesktop()?'把卡片拖到某一天，就排進那天做':'點卡片可設定「哪天做」'}</span></h3>${trayOpen&&tray.length?`<div class="tray-list">${tray.map(miniHTML).join('')}</div>`:''}</section><div class="week-grid">`;
  for(let i=0;i<7;i++){
    const ts=weekTs+i*dayMs; const all=alive().filter(t=>when(t)===ts);
    const pend=all.filter(t=>!t.done).sort(sortDay), doneN=all.length-pend.length; const mins=pend.reduce((s,t)=>s+(t.duration||0),0);
    html+=`<section class="day dz ${ts===todayTs()?'today':''} ${mins>360?'heavy':''}" data-ts="${ts}"><header class="day-head" data-goday="${ts}" title="打開這天"><b>週${'一二三四五六日'[i]} ${fmtMD(ts)}</b><span class="dmood">${moodOf(ts)}</span><span class="dsum">${[pend.length?pend.length+' 件':'',mins?fmtDur(mins):'',doneN?'✓'+doneN:'',logMins(ts)?'🕒'+fmtHM(logMins(ts)):''].filter(Boolean).join(' ・ ')}</span></header><div class="day-list">${pend.map(miniHTML).join('')||`<div class="day-empty">${doneN?'都完成了 ✨':'—'}</div>`}</div></section>`;
  }
  document.getElementById('week-board').innerHTML=html+'</div>';
}

  }).join('');

  if(searchQ)shown=shown.filter(t=>t.title.includes(searchQ)||(t.note||'').includes(searchQ)||(t.tags||[]).some(n=>n.includes(searchQ)));
  if(!shown.length){document.getElementById('all-list').innerHTML=emptyHTML(searchQ?'找不到符合的記錄':'這裡空空的，太強了吧 ✨',searchQ?'🔍':'🌤️');return;}

const PRAISE=['太棒了！','又解決一件！','效率超高 ⚡','做得好！','離自由更近一步 🕊️','穩穩前進中 🌱','收工的感覺真好！','你比五分鐘前的自己更強了 💪','進度條因你而動 📈','手感正熱 🔥','漂亮收下 ✨','這就是實力 😎'];
const PRAISE_ALL=['清空啦！你是傳奇 🌟','完美的一天 ✨','全數殲滅！去耍廢吧 🛋️','今天的你無敵 🏆'];
const MILESTONES={3:'節奏出來了，繼續保持',7:'整整一週！太猛了',14:'兩週不間斷，穩定得可怕',30:'30 天，傳說級的自律',60:'兩個月了，已經是習慣',100:'100 天！你是神'};
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

/* 連擊：90 秒內接連完成會累加 */
let combo=0, lastDoneAt=0;
async function toggleDone(t,clientX,clientY,el){
  t.done=!t.done; t.updated=Date.now();
  if(!t.done){ buzz(8); t.doneAt=null; render(); await persist(t); return; }
  buzz([18,40,24]);
  const firstToday=!alive().some(x=>x!==t&&x.done&&x.doneAt===todayTs());
  t.doneAt=todayTs();
  const st=streak();
  const allDone=when(t)===todayTs()&&alive().filter(x=>when(x)===todayTs()&&!x.done).length===0;
  let clone=null;
  // 重複任務：完成後自動生成下一次（檢查清單重設）
  if(t.repeat&&t.due!=null&&!t.spawned){
    t.spawned=true;
    clone=blankTask({ title:t.title, due:advance(t.due,t.repeat), time:t.time, pri:t.pri, repeat:t.repeat, tags:[...(t.tags||[])],
      duration:t.duration, goalId:t.goalId, note:t.note||'', link:t.link||'', checks:(t.checks||[]).map(c=>({...c,done:false})) });
    tasks.unshift(clone); queuePush(taskRow(clone));
  }
  const now=Date.now(); combo=now-lastDoneAt<90000?combo+1:1; lastDoneAt=now;
  celebrate(clientX,clientY,{allDone,combo,nth:alive().filter(x=>x.done&&x.doneAt===todayTs()).length});
  if(el&&!reduced()) await animateOut(el);
  render();
  if(allDone) showBadge('✅','今日全部完成！',pick(PRAISE_ALL),'check');
  if(firstToday&&MILESTONES[st]) showBadge('🔥',`連續 ${st} 天`,MILESTONES[st]);
  // 完成的事會從清單消失，給一個復原的機會

/* ===================== 時間紀錄 ===================== */
const liveLogs = () => logs.filter(l=>!l.deleted);
const fmtHM = m => m<60?`${m}m`:`${Math.floor(m/60)}h${m%60?String(m%60).padStart(2,'0')+'m':''}`;
const logColor = l => l.tag?tagColor(l.tag):'#94A3B8';
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const logMins = day => liveLogs().filter(l=>l.day===day).reduce((s,l)=>s+(l.end-l.start),0);
/* 「14:00-15:30 讀書 #課業」「9-10 早餐」「下午2-3 午睡」 */
function parseLog(raw){
  let text=' '+raw.trim()+' ', tag=null;
  text=text.replace(/#(\S+)/,(m,w)=>{tag=w;return' ';});
  const pm=/下午|晚上/.test(text);
  const m=text.match(/(\d{1,2})(?:[:：](\d{2}))?\s*[-–~～到至]\s*(\d{1,2})(?:[:：](\d{2}))?/);
  let start=null,end=null;
  if(m&&+m[1]<=24&&+m[3]<=24){
    let a=(+m[1])*60+(+(m[2]||0)), b=(+m[3])*60+(+(m[4]||0));
    if(pm&&a<720){a+=720;if(b<720)b+=720;}
    if(b<=a&&b+720>a&&b<720)b+=720;               // 11-1 → 11:00–13:00
    if(a<b&&b<=1440){ start=a; end=b; text=text.replace(m[0],' ').replace(/下午|晚上/,' '); }
  }
  return {start,end,tag,text:text.replace(/\s+/g,' ').trim()};
}
function addLog(fields){
  const now=Date.now();
  const l={id:'l'+now+Math.random().toString(36).slice(2,5),day:logDay,start:0,end:0,text:'',tag:null,created:now,updated:now,deleted:false,...fields};
  if(l.tag&&!tags.some(x=>x.name===l.tag&&!x.del))ensureTag(l.tag);
  logs.push(l); persistLog(l); return l;
}
async function persistLog(l){ await Local.set('logs',logs); queuePush(logRow(l)); }
function logDone(l){ buzz([12,30,12]); chime(0); showPraise(`記下了 ✍️ ${fmtHM(l.end-l.start)}`); }

function clockText(){ if(!timer)return''; const s=Math.max(0,Math.floor((Date.now()-timer.startMs)/1000)); return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
setInterval(()=>{ const c=document.getElementById('timer-clock'); if(c&&timer)c.textContent=clockText(); },1000);
/* 從背景切回來（滑走、鎖螢幕後）立刻更新；計時只存開始時間，所以離開多久都算得準 */

async function stopTimer(){
  if(!timer)return;
  const s=new Date(timer.startMs), e=new Date();
  const start=s.getHours()*60+s.getMinutes(); let end=startOfDay(e)===timer.day?e.getHours()*60+e.getMinutes():1440; if(end<=start)end=start+1;
  const l=addLog({day:timer.day,start,end,text:timer.text||'計時',tag:timer.tag});
  timer=null; await Local.set('timer',null);
  logDone(l); render(); renderQuick();

function renderLog(){

  let r0=360; const r1=1440; for(const l of list)r0=Math.min(r0,Math.floor(l.start/60)*60);

    <div class="log-sum">${Object.entries(byTag).sort((a,b)=>b[1]-a[1]).map(([k,m])=>`<span class="tag ${k?'user':'dur'}"${k?` style="background:${tagColor(k)}"`:''}>${k?'#'+esc(k):'未分類'} ${fmtHM(m)}</span>`).join('')}</div>
    ${list.map(l=>`<div class="log-row" data-lid="${l.id}"><span class="lc" style="background:${logColor(l)}"></span><span class="lt">${fmtTime(l.start)}–${fmtTime(Math.min(l.end,1439))}</span><span class="lx">${esc(l.text||'（未命名）')}${l.tag?` <span class="ltag">#${esc(l.tag)}</span>`:''}</span><span class="ld">${fmtHM(l.end-l.start)}</span></div>`).join('')}`:''}`;
}

/* 音效：用 Web Audio 合成，不需要音檔；連擊越高音越高 */
let soundOn=true, actx=null;
function chime(level=0){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime, up=Math.pow(2,Math.max(0,level)*2/12);
    const notes=level>=99?[523.25,659.25,783.99,1046.5,1318.5]:[659.25*up,987.77*up,1318.5*up];
    notes.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type=i%2?'sine':'triangle'; o.frequency.value=f;
      const s=t0+i*(level>=99?0.09:0.06); g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(level>=99?.16:.13,s+.012); g.gain.exponentialRampToValueAtTime(.0008,s+.6);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+.65); });
  }catch(e){}
}

/* 彩帶引擎：多種形狀、可疊加多次噴發 */
const FX={cv:document.getElementById('fx-canvas'),ctx:null,raf:0,parts:[],
  init(){const dpr=Math.min(devicePixelRatio||1,1.5);this.cv.width=innerWidth*dpr;this.cv.height=innerHeight*dpr;this.ctx=this.cv.getContext('2d');this.ctx.setTransform(dpr,0,0,dpr,0,0);}};
const GOLDS=['#F59E0B','#FBBF24','#FDE68A','#D9A406','#FFF3C4','#FFFFFF'];
const BRIGHTS=[...TAG_COLORS,'#FBBF24','#F472B6','#34D399','#60A5FA','#F87171'];
function confetti(x,y,mode){
  if(reduced())return;
  const k=innerWidth<600?0.7:1, cx=x||innerWidth/2, cy=y||innerHeight/2;
  const COLORS=mode==='gold'?GOLDS:BRIGHTS;
  const shape=()=>{const r=Math.random(); return r<.42?'rect':r<.66?'circle':r<.84?'ribbon':'star';};
  const P=o=>({s:Math.random()*6+4,r:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.4,c:COLORS[Math.floor(Math.random()*COLORS.length)],sh:shape(),life:1,decay:.009+Math.random()*.006,grav:.3,drag:.982,...o});
  const add=(n,f)=>{ for(let i=0;i<n*k;i++)FX.parts.push(f()); };
  const cannons=()=>{ for(const side of [0,1]) add(70,()=>{ const a=(55+Math.random()*25)*Math.PI/180, sp=Math.random()*9+15; return P({x:side?innerWidth+10:-10,y:innerHeight*.9,vx:(side?-1:1)*Math.cos(a)*sp,vy:-Math.sin(a)*sp,grav:.28}); }); };
  if(mode==='rain'){ add(160,()=>P({x:Math.random()*innerWidth,y:-20-Math.random()*240,vx:(Math.random()-.5)*4,vy:Math.random()*3+2,grav:.07,decay:.005})); cannons(); }
  else{ add(mode==='gold'?110:80,()=>{ const a=Math.random()*Math.PI*2, sp=Math.random()*11+4; return P({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4}); }); if(mode==='gold')cannons(); }
  runFX();
}
function drawStar(ctx,s){ ctx.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?s*.45:s, a=i*Math.PI/5-Math.PI/2; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); }
function runFX(){
  if(FX.raf)return; FX.init(); FX.cv.style.display='block'; const ctx=FX.ctx;
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    FX.parts=FX.parts.filter(p=>p.life>0&&p.y<innerHeight+40);
    for(const p of FX.parts){
      p.vx*=p.drag; p.vy=p.vy*p.drag+p.grav; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=p.decay;
      ctx.globalAlpha=Math.max(Math.min(p.life*1.6,1),0); ctx.fillStyle=p.c;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      if(p.sh==='circle'){ ctx.beginPath(); ctx.arc(0,0,p.s*.45,0,Math.PI*2); ctx.fill(); }
      else if(p.sh==='ribbon'){ ctx.scale(1,Math.cos(p.r*3)); ctx.fillRect(-p.s*.18,-p.s,p.s*.36,p.s*2); }
      else if(p.sh==='star'){ drawStar(ctx,p.s*.75); }
      else { ctx.scale(1,Math.cos(p.r*2)); ctx.fillRect(-p.s/2,-p.s*.3,p.s,p.s*.6); }
      ctx.restore();
    }
    ctx.globalAlpha=1;
    if(FX.parts.length&&!document.hidden) FX.raf=requestAnimationFrame(tick);
    else { FX.parts=[]; FX.raf=0; ctx.clearRect(0,0,innerWidth,innerHeight); FX.cv.style.display='none'; }
  })();
}

/* ===================== 儲存 + 同步 ===================== */
/* 目標、心情、筆記也存在同一張表；data 裡放 deleted:true，舊版 App 讀到會當成已刪除而忽略 */
const taskRow  = t => ({id:t.id,data:t,updated:t.updated,deleted:!!t.deleted});
const goalRow  = g => ({id:'g:'+g.id,data:{kind:'goal',deleted:true,goal:g},updated:g.updated,deleted:!!g.deleted});
const tagsRow  = () => ({id:'__tags__',data:{tags},updated:Date.now(),deleted:false});
const moodsRow = () => ({id:'__moods__',data:{kind:'moods',deleted:true,moods},updated:Date.now(),deleted:false});
const logRow   = l => ({id:'l:'+l.id,data:{kind:'log',deleted:true,log:l},updated:l.updated,deleted:!!l.deleted});
const memoRow  = () => ({id:'__memo__',data:{kind:'memo',deleted:true,memo},updated:memo.upd||Date.now(),deleted:false});
async function persist(t){ await Local.set('tasks',tasks); queuePush(taskRow(t)); }
function queuePush(row){ pendingPush=pendingPush.filter(r=>r.id!==row.id); pendingPush.push(row); flushPush(); }
function queueMany(rows){ const ids=new Set(rows.map(r=>r.id)); pendingPush=pendingPush.filter(r=>!ids.has(r.id)).concat(rows); flushPush(); }
let flushing=false;
async function flushPush(){
  if(!Cloud.enabled||flushing||!pendingPush.length)return;
  flushing=true; const batch=pendingPush.splice(0); let ok=false;
  try{await Cloud.push(batch);setSyncDot('ok');ok=true;}catch(e){pendingPush.unshift(...batch.filter(b=>!pendingPush.some(p=>p.id===b.id)));setSyncDot('err');}
  flushing=false; if(ok&&pendingPush.length)flushPush();
}
addEventListener('online',flushPush);
function mergeTags(ct){ for(const t of ct){ const l=tags.find(x=>x.name===t.name); if(!l)tags.push(t); else if((t.upd||0)>(l.upd||0))Object.assign(l,t); } }
function mergeMoods(cm){ for(const k in cm){ const r=cm[k], l=moods[k]; if(r&&(!l||(r.upd||0)>(l.upd||0)))moods[k]=r; } }
async function saveAll(){ await Local.set('tasks',tasks); await Local.set('tags',tags); await Local.set('goals',goals); await Local.set('moods',moods); await Local.set('memo',memo); await Local.set('logs',logs); }
async function fullSync(){
  if(!Cloud.enabled){setSyncDot('');return;}
  try{
    const rows=await Cloud.pull(); const localMap=new Map(tasks.map(t=>[t.id,t])); const goalMap=new Map(goals.map(g=>[g.id,g])); const logMap=new Map(logs.map(l=>[l.id,l])); const toPush=[];
    for(const row of rows){
      const id=String(row.id), data=row.data||{};
      if(id==='__tags__'){mergeTags(data.tags||[]);continue;}
      if(id==='__moods__'){mergeMoods(data.moods||{});continue;}
      if(id==='__memo__'){ if(data.memo&&(data.memo.upd||0)>(memo.upd||0))memo=data.memo; continue; }
      if(id.startsWith('l:')){
        const rl=data.log; if(!rl)continue; const ll=logMap.get(rl.id);
        if(!ll)logs.push(rl); else if((rl.updated||0)>(ll.updated||0))Object.assign(ll,rl); else if((ll.updated||0)>(rl.updated||0))toPush.push(logRow(ll));
        logMap.delete(rl.id); continue;
      }
      if(id.startsWith('g:')){
        const rg=data.goal; if(!rg)continue; const lg=goalMap.get(rg.id);
        if(!lg)goals.push(rg); else if((rg.updated||0)>(lg.updated||0))Object.assign(lg,rg); else if((lg.updated||0)>(rg.updated||0))toPush.push(goalRow(lg));
        goalMap.delete(rg.id); continue;
      }
      if(typeof data.title!=='string')continue;
      const local=localMap.get(id);
      if(!local)tasks.push(data);
      else if((row.updated||0)>(local.updated||0))Object.assign(local,data);
      else if((local.updated||0)>(row.updated||0))toPush.push(taskRow(local));
      localMap.delete(id);
    }
    for(const[,local]of localMap)toPush.push(taskRow(local));
    for(const[,g]of goalMap)toPush.push(goalRow(g));
    for(const[,l]of logMap)toPush.push(logRow(l));
    toPush.push(tagsRow(),moodsRow()); if(memo.upd)toPush.push(memoRow());
    await Cloud.push(toPush); migrate();
    await saveAll();
    setSyncDot('ok');
  }catch(e){console.error(e);setSyncDot('err');}
  render(); renderQuick();
}
function migrate(){
  const LEGACY={todo:['待辦','#4F46E5'],hw:['作業','#D97706'],work:['工作','#0D9488'],event:['日程','#DB2777']};
  let changed=false;
  const fill=(t,k,v)=>{ if(t[k]===undefined){t[k]=v;changed=true;} };
  for(const t of tasks){
    if(t.cat&&LEGACY[t.cat]){const[name,color]=LEGACY[t.cat];if(!tags.some(x=>x.name===name))tags.push({name,color,del:false,upd:1});t.tags=[...new Set([...(t.tags||[]),name])];delete t.cat;t.updated=Date.now();changed=true;}
    if(typeof t.title!=='string'){t.title=String(t.title??'');changed=true;}
    fill(t,'time',null);
    if(t.done&&t.doneAt===undefined){t.doneAt=startOfDay(t.updated||Date.now());changed=true;}
    if(t.doneAt===undefined)t.doneAt=null;
    if(t.pts!==undefined){delete t.pts;changed=true;}
    fill(t,'repeat',null);
    if(t.spawned===undefined)t.spawned=false;
    fill(t,'plan',null); fill(t,'dueEnd',null); fill(t,'duration',null); fill(t,'goalId',null);
    fill(t,'note',''); fill(t,'link',''); fill(t,'checks',[]);
  }
  for(const g of tags)if(g.del===undefined){g.del=false;g.upd=g.upd||1;changed=true;}
  for(const g of goals){ if(!Array.isArray(g.steps)){g.steps=[];changed=true;} if(g.deleted===undefined){g.deleted=false;changed=true;} }
  return changed;
}

function exportData(){

/* "2026-10-20" → 當地午夜；"2026-10-20 11:00:00Z" → 換成當地時間 */
function parseWhen(s){
  if(!s)return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const[y,m,d]=s.split('-').map(Number); return {ts:startOfDay(new Date(y,m-1,d)),time:null,ms:null}; }
  const d=new Date(String(s).replace(' ','T')); if(isNaN(d))return null;
  return {ts:startOfDay(d),time:d.getHours()*60+d.getMinutes(),ms:d.getTime()};
}
function addTagIfMissing(name,color,now){ const ex=tags.find(x=>x.name===name); if(!ex)tags.push({name,color:color||tagColor(name),del:false,upd:now}); else if(ex.del){ex.del=false;ex.upd=now;} }
const mkChecks = (id,list) => (list||[]).map((c,i)=>typeof c==='string'?{id:id+'-c'+i,t:c,done:false}:{id:id+'-c'+i,t:c.t,done:!!c.done});

/* Notion 等外部來源轉出的通用格式；用固定 id，重複匯入會跳過已存在的 */
function importPortable(d){
  const now=Date.now(), rows=[]; let nT=0,nG=0,skip=0;
  for(const tg of d.tags||[]) addTagIfMissing(tg.name,tg.color,now);
  const gmap={};
  for(const x of d.goals||[]){
    const id='n-'+(x.notion||x.key); gmap[x.key]=id;
    if(goals.some(g=>g.id===id)){skip++;continue;}
    const g={id,emoji:x.emoji||'🎯',title:x.title,next:x.next||'',steps:(x.steps||[]).map((s,i)=>({id:id+'-s'+i,t:s.t,done:!!s.done})),note:x.note||'',link:x.link||(x.notion?'https://www.notion.so/'+x.notion:''),created:now,updated:now,deleted:false};
    goals.push(g); rows.push(goalRow(g)); nG++;
  }
  for(const x of d.tasks||[]){
    const id=x.id||('n-'+x.notion);
    if(tasks.some(t=>t.id===id)){skip++;continue;}
    const a=parseWhen(x.start), b=parseWhen(x.end);
    let dueEnd=null, duration=x.duration??null;
    if(a&&b){ if(a.ms!=null&&b.ms!=null)duration=Math.round((b.ms-a.ms)/60000); else if(b.ts>a.ts)dueEnd=b.ts; }
    const tl=[...(x.tags||[])]; if(x.exam&&!tl.includes('考試'))tl.push('考試');
    for(const n of tl)addTagIfMissing(n,null,now);
    const t=blankTask({id,title:x.title,due:a?a.ts:null,dueEnd,time:a?a.time:null,pri:!!(x.pri||x.exam),repeat:x.repeat||null,tags:tl,duration,
      goalId:x.goal?(gmap[x.goal]||null):null,note:x.note||'',link:x.link||(x.notion?'https://www.notion.so/'+x.notion:''),checks:mkChecks(id,x.checks),
      done:!!x.done,doneAt:x.done?Math.min(a?a.ts:todayTs(),todayTs()):null,created:now,updated:now});
    tasks.push(t); rows.push(taskRow(t)); nT++;
  }
  if(d.memo&&!memo.text.includes(d.memo.slice(0,30))){ memo={text:memo.text?memo.text+'\n\n'+d.memo:d.memo,upd:now}; rows.push(memoRow()); }
  rows.push(tagsRow());
  return {rows,msg:`匯入 ${nT} 筆待辦、${nG} 個目標${skip?`（${skip} 筆已存在，略過）`:''}`};
}
function importBackup(d){
  const rows=[]; let n=0;
  for(const t of d.tasks||[]){ if(!t||typeof t.title!=='string')continue; const l=tasks.find(x=>x.id===t.id); if(!l){tasks.push(t);rows.push(taskRow(t));n++;} else if((t.updated||0)>(l.updated||0)){Object.assign(l,t);rows.push(taskRow(l));n++;} }
  for(const g of d.goals||[]){ const l=goals.find(x=>x.id===g.id); if(!l){goals.push(g);rows.push(goalRow(g));} else if((g.updated||0)>(l.updated||0)){Object.assign(l,g);rows.push(goalRow(l));} }
  for(const l of d.logs||[]){ const x=logs.find(y=>y.id===l.id); if(!x){logs.push(l);rows.push(logRow(l));} else if((l.updated||0)>(x.updated||0)){Object.assign(x,l);rows.push(logRow(x));} }
  mergeTags(d.tags||[]); mergeMoods(d.moods||{});
  if(d.memo&&(d.memo.upd||0)>(memo.upd||0))memo=d.memo;
  rows.push(tagsRow(),moodsRow(),memoRow());
  return {rows,msg:`從備份還原／合併 ${n} 筆待辦`};
}
/* 舊版「矩陣週計畫」(time.0) 的 localStorage 資料 */
function importTime0(d){
  const now=Date.now(), rows=[]; let nT=0,nG=0;
  const clean=s=>String(s||'').replace(/�/g,'').replace(/^[👤👥?]+\s*/u,'').trim();
  const byOrig={}, fresh=new Set(), used=new Set();
  for(const z of ['inbox','q1','q2']) for(const x of (d.matrix&&d.matrix[z])||[]){
    const id='t0-'+x.id; byOrig[x.id]=id; if(tasks.some(t=>t.id===id))continue;
    const a=parseWhen(x.dueDate);
    if(x.type==='group')addTagIfMissing('合作','#0D9488',now);
    const t=blankTask({id,title:clean(x.text),due:a?a.ts:null,duration:+x.duration||null,tags:x.type==='group'?['合作']:[],pri:z!=='inbox',done:!!x.completed,doneAt:x.completed?todayTs():null});
    tasks.push(t); fresh.add(id); rows.push(taskRow(t)); nT++;
  }
  for(const [date,list] of Object.entries(d.planner||{})) for(const x of list||[]){
    const a=parseWhen(date); if(!a)continue;
    const mid=x.originalId&&byOrig[x.originalId];
    if(mid&&!fresh.has(mid)&&tasks.some(t=>t.id===mid))continue;        // 之前匯入過
    if(mid&&fresh.has(mid)&&!used.has(mid)){ const m=tasks.find(t=>t.id===mid); m.plan=a.ts===m.due?null:a.ts; if(x.completed){m.done=true;m.doneAt=a.ts;} used.add(mid); continue; }
    const id='t0-'+x.id; if(tasks.some(t=>t.id===id))continue;
    const b=parseWhen(x.dueDate);
    const t=blankTask({id,title:clean(x.text),due:b?b.ts:null,plan:a.ts,duration:+x.duration||null,tags:x.type==='group'?['合作']:[],done:!!x.completed,doneAt:x.completed?a.ts:null});
    if(t.plan===t.due)t.plan=null; if(t.due==null){t.due=t.plan;t.plan=null;}
    tasks.push(t); rows.push(taskRow(t)); nT++;
  }
  for(const g0 of d.goals||[]){
    const id='t0-'+g0.id; if(goals.some(g=>g.id===id))continue;
    const g={id,emoji:'🏔️',title:clean(g0.title)||'目標',next:'',steps:(g0.subTasks||[]).map((s,i)=>({id:id+'-s'+i,t:clean(s.text),done:!!s.done})),note:'',link:'',created:now,updated:now,deleted:false};
    goals.push(g); rows.push(goalRow(g)); nG++;
  }
  let nM=0; for(const [date,v] of Object.entries(d.moods||{})){ const a=parseWhen(date); if(a&&v&&!(moods[a.ts]&&moods[a.ts].v)){moods[a.ts]={v:+v,upd:now};nM++;} }
  rows.push(tagsRow(),moodsRow());
  return {rows,msg:`從舊版匯入 ${nT} 筆待辦、${nG} 個目標、${nM} 天心情`};
}
async function runImport(d){
  let res;
  if(d&&d.format==='quickdo-import') res=importPortable(d);
  else if(d&&d.format==='quickdo-backup') res=importBackup(d);
  else if(d&&(d.matrix||d.planner)) res=importTime0(d);
  else throw new Error('看不懂這個檔案的格式');
  migrate(); await saveAll(); queueMany(res.rows);
  render(); renderQuick();
  return res.msg;
}

    document.getElementById('tag-manage').onclick=async e=>{const b=e.target.closest('.tg');if(!b)return;if(!b.classList.contains('confirm')){$modal.querySelectorAll('.tg').forEach(x=>x.classList.remove('confirm'));b.classList.add('confirm');b.querySelector('.x').textContent='確定刪除？';return;}await deleteTag(b.dataset.name);document.getElementById('tag-manage').innerHTML=manageHTML();renderQuick();render();};

    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('m-ok').click();}};
  }
  else if(kind==='edit'){
    const t=task; const sel=new Set(t.tags||[]); let rep=t.repeat||null, dur=t.duration||null;
    const checks=(t.checks||[]).map(c=>({...c}));
    const link=safeUrl(t.link);
    const segHTML=(id,opts,cur)=>`<div class="seg" id="${id}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${String(cur??'')===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
    $modal.innerHTML=`<h2>編輯</h2>
      <label for="e-title">內容</label><input type="text" id="e-title" value="${esc(t.title)}">
      <div class="row" style="margin-top:8px"><button type="button" class="mini-btn" id="e-timer">▶ 用這件事開始計時</button></div>
      <label for="e-goal">歸屬目標</label><select id="e-goal"><option value="">（無）</option>${liveGoals().map(g=>`<option value="${esc(g.id)}" ${g.id===t.goalId?'selected':''}>${esc(g.emoji||'🎯')} ${esc(shortTitle(g))}</option>`).join('')}</select>
      <label>標籤</label><div class="tag-pick">${liveTagsSorted().map(g=>`<button type="button" class="q" data-tag="${esc(g.name)}" style="${sel.has(g.name)?`background:${g.color};color:#fff;box-shadow:none`:'box-shadow:none;border:1.5px solid var(--line)'}">#${esc(g.name)}</button>`).join('')||'<span style="font-size:13px;color:var(--ink-soft)">還沒有標籤</span>'}</div>
      <div class="two"><div><label for="e-date">截止日</label><input type="date" id="e-date" value="${toInput(t.due)}"></div><div><label for="e-time">時間</label><input type="time" id="e-time" value="${t.time!=null?fmtTime(t.time):''}"></div></div>
      ${t.dueEnd!=null?`<label for="e-dend">結束日（期間）</label><input type="date" id="e-dend" value="${toInput(t.dueEnd)}">`:''}
      <label for="e-plan">哪天做（計畫日，不填就跟截止日同一天）</label>
      <div class="row"><input type="date" id="e-plan" value="${toInput(t.plan)}"><button type="button" class="mini-btn" data-plan="0">今天</button><button type="button" class="mini-btn" data-plan="1">明天</button><button type="button" class="mini-btn" data-plan="x">清除</button></div>
      <label>預估時間</label>${segHTML('e-dur',[['','不設'],[15,'15m'],[30,'30m'],[60,'1h'],[90,'1.5h'],[120,'2h'],[180,'3h']],dur)}
      <label>重複</label>${segHTML('e-rep',[['','不重複'],['daily','每天'],['weekly','每週'],['monthly','每月']],rep)}
      <h3>☑ 檢查清單</h3><div id="e-checks"></div>
      <div class="row"><input type="text" id="e-ck-in" placeholder="新增項目…"><button type="button" class="mini-btn" id="e-ck-add">＋</button></div>
      <label for="e-note">備註</label><textarea id="e-note" rows="3" placeholder="細節、要帶的東西、誰負責…">${esc(t.note||'')}</textarea>
      <label for="e-link">連結</label><div class="row"><input type="text" id="e-link" value="${esc(t.link||'')}" placeholder="https://">${link?`<a class="mini-btn" href="${esc(link)}" target="_blank" rel="noopener">開啟</a>`:''}</div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14.5px;color:var(--ink)"><input type="checkbox" id="e-pri" ${t.pri?'checked':''} style="width:17px;height:17px"> 標記為重要</label>
      <div class="modal-btns"><button class="warn" id="m-del">刪除</button><button id="m-cancel">取消</button><button class="primary" id="m-ok">儲存</button></div>`;
    $overlay.classList.add('show');
    const $ck=document.getElementById('e-checks');
    const drawChecks=()=>{ $ck.innerHTML=checksHTML(checks); };
    drawChecks(); bindChecks($ck,checks,drawChecks);
    const addCk=()=>{ const i=document.getElementById('e-ck-in'); const v=i.value.trim(); if(!v)return; checks.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,5),t:v,done:false}); i.value=''; drawChecks(); i.focus(); };
    document.getElementById('e-ck-add').onclick=addCk;
    document.getElementById('e-ck-in').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addCk();}};
    $modal.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{ const v=b.dataset.plan; document.getElementById('e-plan').value=v==='x'?'':toInput(todayTs()+(+v)*dayMs); });
    $modal.querySelector('.tag-pick').onclick=e=>{const b=e.target.closest('[data-tag]');if(!b)return;const n=b.dataset.tag;if(sel.has(n)){sel.delete(n);b.style='box-shadow:none;border:1.5px solid var(--line)';}else{sel.add(n);b.style=`background:${tagColor(n)};color:#fff;box-shadow:none`;}};
    const segBind=(id,set)=>{document.getElementById(id).onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;set(b.dataset.v);$modal.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));};};
    segBind('e-dur',v=>dur=v?+v:null); segBind('e-rep',v=>rep=v||null);
    document.getElementById('m-ok').onclick=async()=>{
      t.title=document.getElementById('e-title').value.trim()||t.title;
      t.due=fromInput(document.getElementById('e-date').value);
      const de=document.getElementById('e-dend'); if(de){ const v=fromInput(de.value); t.dueEnd=(v!=null&&t.due!=null&&v>t.due)?v:null; }
      const tvv=document.getElementById('e-time').value; t.time=tvv?(()=>{const[h,m]=tvv.split(':').map(Number);return h*60+m;})():null;
      t.plan=fromInput(document.getElementById('e-plan').value); if(t.plan!=null&&t.plan===t.due)t.plan=null;
      t.duration=dur; t.repeat=rep; if(t.repeat&&t.due==null)t.due=todayTs();
      t.pri=document.getElementById('e-pri').checked;
      t.tags=[...sel]; t.goalId=document.getElementById('e-goal').value||null; t.checks=checks;
      t.note=document.getElementById('e-note').value.trim(); t.link=document.getElementById('e-link').value.trim();
      t.updated=Date.now(); closeModal(); render(); await persist(t);
    };
    document.getElementById('m-del').onclick=async()=>{closeModal();await softDelete(t);};
    document.getElementById('e-timer').onclick=async()=>{ if(timer&&!confirm('已經有一個計時在跑，要結束它並改計這件事嗎？'))return; if(timer)await stopTimer(); await startTimer(t.title,(t.tags||[])[0]); closeModal(); view='log'; logDay=todayTs(); revealNext=true; render(); scrollTo({top:0}); };
  }
  else if(kind==='log'){
    const l=task;
    $modal.innerHTML=`<h2>編輯時間紀錄</h2>
      <label for="lg-text">做了什麼</label><input type="text" id="lg-text" value="${esc(l.text)}">
      <div class="two"><div><label for="lg-s">開始</label><input type="time" id="lg-s" value="${fmtTime(l.start)}"></div><div><label for="lg-e">結束</label><input type="time" id="lg-e" value="${fmtTime(Math.min(l.end,1439))}"></div></div>
      <label for="lg-tag">標籤</label><select id="lg-tag"><option value="">（未分類）</option>${liveTagsSorted().map(g=>`<option value="${esc(g.name)}" ${g.name===l.tag?'selected':''}>#${esc(g.name)}</option>`).join('')}</select>
      <div id="lg-msg" class="note"></div>
      <div class="modal-btns"><button class="warn" id="m-del">刪除</button><button id="m-cancel">取消</button><button class="primary" id="m-ok">儲存</button></div>`;
    $overlay.classList.add('show');
    const toMin=v=>{ if(!v)return null; const[h,m]=v.split(':').map(Number); return h*60+m; };
    document.getElementById('m-ok').onclick=async()=>{
      const s=toMin(document.getElementById('lg-s').value); let e=toMin(document.getElementById('lg-e').value);
      if(e===1439&&l.end===1440)e=1440;
      if(s==null||e==null||e<=s){ document.getElementById('lg-msg').textContent='結束時間要比開始晚'; return; }
      l.start=s; l.end=e; l.text=document.getElementById('lg-text').value.trim(); l.tag=document.getElementById('lg-tag').value||null; l.updated=Date.now();
      closeModal(); render(); await persistLog(l);
    };
    document.getElementById('m-del').onclick=async()=>{ l.deleted=true; l.updated=Date.now(); closeModal(); render(); await persistLog(l); showToast('已刪除這筆紀錄',async()=>{ l.deleted=false; l.updated=Date.now(); render(); await persistLog(l); }); };
  }
  else if(kind==='pickgoal'){
    const opts=[['','（不歸屬目標）'],...liveGoals().map(g=>[g.id,(g.emoji||'🎯')+' '+shortTitle(g)])];
    $modal.innerHTML=`<h2>🎯 這筆要歸到哪個目標？</h2><div class="pick-list">${opts.map(([id,l])=>`<button type="button" class="pick ${(composer.goal||'')===id?'on':''}" data-gid="${esc(id)}">${esc(l)}</button>`).join('')}</div><div class="modal-btns"><button id="m-cancel">關閉</button></div>`;
    $overlay.classList.add('show');
    $modal.querySelector('.pick-list').onclick=e=>{const b=e.target.closest('[data-gid]');if(!b)return;composer.goal=b.dataset.gid||null;closeModal();renderQuick();};
  }
  else if(kind==='newgoal'){
    $modal.innerHTML=`<h2>新增長期目標</h2><div class="g-edit-head" style="margin-top:10px"><input type="text" id="ng-emoji" class="emoji-in" maxlength="4" value="🎯" aria-label="圖示"><input type="text" id="ng-title" placeholder="例如：日檢 N4、畢業專題、存到第一桶金"></div><div class="modal-btns"><button id="m-cancel">取消</button><button class="primary" id="m-ok">建立</button></div>`;
    $overlay.classList.add('show');
    const ti=document.getElementById('ng-title'); setTimeout(()=>ti.focus(),60);
    const ok=async()=>{ const v=ti.value.trim(); if(!v)return; const g=newGoal(v,document.getElementById('ng-emoji').value.trim()); goals.push(g); await persistGoal(g); render(); openModal('goal',g); };
    document.getElementById('m-ok').onclick=ok; ti.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok();}};
  }
  else if(kind==='goal'){
    const g=task;
    const refresh=(focusId)=>{ const sc=$modal.scrollTop; openModal('goal',g); $modal.scrollTop=sc; if(focusId){const f=document.getElementById(focusId); if(f)f.focus();} render(); };
    const st=goalStats(g); const steps=g.steps||(g.steps=[]);
    const pend=st.ts.filter(t=>!t.done).sort(sortWhen); const doneN=st.ts.length-pend.length;
    const link=safeUrl(g.link);
    $modal.innerHTML=`<div class="g-edit-head"><input type="text" id="g-emoji" class="emoji-in" maxlength="4" value="${esc(g.emoji||'🎯')}" aria-label="圖示"><input type="text" id="g-title" value="${esc(g.title)}" placeholder="目標名稱"></div>
      <div class="bar" style="margin:12px 0 5px"><div class="fill" style="width:${st.total?st.done/st.total*100:0}%"></div></div>
      <div class="g-sub">${st.done}/${st.total} 完成${st.next?` ・ 下個節點：${fmtDue(st.next.due)}「${esc(st.next.title)}」`:''}</div>
      <label for="g-next">👉 下一個動作</label>
      <div class="row"><input type="text" id="g-next" value="${esc(g.next||'')}" placeholder="現在最該做的一件小事"><button type="button" class="mini-btn" id="g-next-add">放進待辦</button></div>
      <h3>🪜 里程碑／步驟 ・ ${steps.filter(s=>s.done).length}/${steps.length}</h3>
      <div id="g-steps">${checksHTML(steps)}</div>
      <div class="row"><input type="text" id="g-step-in" placeholder="新增步驟…"><button type="button" class="mini-btn" id="g-step-add">＋</button></div>
      <h3>📋 相關待辦 ・ 未完成 ${pend.length}${doneN?`，已完成 ${doneN}`:''}</h3>
      <div id="g-tasks">${pend.map(t=>`<div class="g-task" data-id="${t.id}"><button type="button" class="ck" aria-label="完成"></button><span class="g-task-t">${esc(t.title)}</span><span class="g-task-d ${isOverdue(t)?'late':''}">${when(t)!=null?fmtDue(when(t)):'未排程'}</span></div>`).join('')||'<div class="note">還沒有相關待辦</div>'}</div>
      <div class="row"><input type="text" id="g-task-in" placeholder="新增待辦（例：週五 交初稿 2h）"><button type="button" class="mini-btn" id="g-task-add">＋</button></div>
      <h3>📝 筆記</h3><textarea id="g-note" rows="9" placeholder="為什麼做、完成的樣子、待確認…">${esc(g.note||'')}</textarea>
      <label for="g-link">連結（Notion、雲端資料夾…）</label>
      <div class="row"><input type="text" id="g-link" value="${esc(g.link||'')}" placeholder="https://">${link?`<a class="mini-btn" href="${esc(link)}" target="_blank" rel="noopener">開啟</a>`:''}</div>
      <div class="modal-btns"><button class="warn" id="g-del">按住刪除目標</button><button class="primary" id="m-cancel">完成</button></div>`;
    $overlay.classList.add('show');
    for(const [id,k] of [['g-emoji','emoji'],['g-title','title'],['g-next','next'],['g-note','note'],['g-link','link']])
      document.getElementById(id).oninput=e=>{ g[k]=e.target.value; g.updated=Date.now(); persistGoalSoon(g); };
    document.getElementById('g-next-add').onclick=()=>{ const v=(g.next||'').trim(); if(!v)return; const t=addTask({...parse(v),title:parse(v).title||v,goal:g.id}); showToast('已放進待辦：'+t.title.slice(0,16)); refresh(); };
    bindChecks(document.getElementById('g-steps'),steps,()=>{ g.updated=Date.now(); persistGoal(g); refresh(); });
    const addStep=()=>{ const i=document.getElementById('g-step-in'); const v=i.value.trim(); if(!v)return; steps.push({id:'s'+Date.now()+Math.random().toString(36).slice(2,5),t:v,done:false}); g.updated=Date.now(); persistGoal(g); refresh('g-step-in'); };
    document.getElementById('g-step-add').onclick=addStep;
    document.getElementById('g-step-in').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addStep();}};
    document.getElementById('g-tasks').onclick=async e=>{ const row=e.target.closest('.g-task'); if(!row)return; const t=tasks.find(x=>x.id===row.dataset.id); if(!t)return;
      if(e.target.closest('.ck')){ await toggleDone(t,e.clientX,e.clientY); refresh(); } else openModal('edit',t); };
    const addGT=()=>{ const i=document.getElementById('g-task-in'); const p=parse(i.value); if(!p.title)return; addTask({...p,goal:g.id}); refresh('g-task-in'); };
    document.getElementById('g-task-add').onclick=addGT;
    document.getElementById('g-task-in').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addGT();}};
    holdToConfirm(document.getElementById('g-del'),()=>{ g.deleted=true; g.updated=Date.now(); persistGoal(g); closeModal(); render(); showToast('已刪除目標「'+shortTitle(g)+'」',async()=>{g.deleted=false;g.updated=Date.now();await persistGoal(g);render();}); });
  }
  else{
    $modal.innerHTML=`<h2>設定</h2>
      <h3>🎉 完成特效</h3>
      <label class="switch-row"><input type="checkbox" id="s-sound" ${soundOn?'checked':''}> 完成時播放音效</label>
      <h3>💾 資料匯入／匯出</h3>
      <div class="modal-btns" style="margin-top:4px"><button id="d-export">匯出備份</button><button id="d-import">匯入檔案…</button></div>
      <p class="note">可匯入 QuickDo 備份檔，或從 Notion 轉出的 <b>quickdo-notion-import.json</b>。重複匯入不會產生重複項目。</p>
      <details><summary>從舊版「矩陣週計畫」匯入</summary>
        <p>1. 用電腦瀏覽器打開舊的 time.0.htm，按 F12 打開「Console（主控台）」。</p>
        <p>2. 輸入 <code>copy(localStorage.timeManagerV8)</code> 按 Enter，資料會複製到剪貼簿。</p>
        <p>3. 回到這裡貼上，按「匯入」。收件匣、矩陣、週計畫、長期目標、心情都會搬過來。</p>
        <textarea id="t0-json" rows="4" placeholder="把複製的內容貼在這裡"></textarea>
        <div class="modal-btns" style="margin-top:8px"><button class="primary" id="t0-go">匯入</button></div>
      </details>
      <div id="data-msg"></div>
      <h3>☁️ 雲端同步（Supabase）</h3>
      <label for="sb-url">Supabase 專案網址</label><input type="text" id="sb-url" placeholder="https://xxxx.supabase.co" value="${esc(Cloud.cfg.url)}"><label for="sb-key">anon public 金鑰</label><input type="text" id="sb-key" placeholder="eyJhbGci..." value="${esc(Cloud.cfg.key)}"><div id="sync-msg"></div><div class="modal-btns"><button id="m-cancel">關閉</button><button class="primary" id="m-ok">測試並儲存</button></div><details><summary>第一次設定？照這三步（約 5 分鐘）</summary><p>1. 到 supabase.com 免費註冊，建立一個專案。</p><p>2. SQL Editor 貼上這段按 Run：</p><pre>create table quickdo (
  id text primary key,
  data jsonb,
  updated bigint,
  deleted boolean default false
);
alter table quickdo enable row level security;
create policy "personal use" on quickdo
  for all using (true) with check (true);</pre><p>3. Settings → API，把 Project URL 與 anon public key 貼上。</p><p class="note">這是個人用簡易設定，拿到網址和金鑰的人就能讀寫資料，請勿公開分享部署網址。</p></details>`;
    $overlay.classList.add('show');
    document.getElementById('s-sound').onchange=async e=>{ soundOn=e.target.checked; await Local.set('sound',soundOn); if(soundOn)chime(2); };
    document.getElementById('d-export').onclick=()=>{ exportData(); const m=document.getElementById('data-msg'); m.textContent='已下載備份檔'; m.className='ok'; };
    document.getElementById('d-import').onclick=()=>document.getElementById('file-in').click();
    document.getElementById('t0-go').onclick=async()=>{ const m=document.getElementById('data-msg'); try{ const raw=document.getElementById('t0-json').value.trim(); if(!raw)return; const msg=await runImport(JSON.parse(raw)); m.textContent='✓ '+msg; m.className='ok'; document.getElementById('t0-json').value=''; }catch(err){ m.textContent='匯入失敗：'+err.message+'（請確認整段都有貼上）'; m.className='err'; } };
    document.getElementById('m-ok').onclick=async()=>{const url=document.getElementById('sb-url').value.trim();const key=document.getElementById('sb-key').value.trim();const msg=document.getElementById('sync-msg');if(!url||!key){Cloud.cfg={url:'',key:''};await Local.set('settings',Cloud.cfg);setSyncDot('');closeModal();return;}Cloud.cfg={url,key};msg.textContent='測試連線中…';msg.className='';try{await Cloud.pull();await Local.set('settings',Cloud.cfg);msg.textContent='連線成功，開始同步！';msg.className='ok';await fullSync();setTimeout(closeModal,700);}catch(e){msg.textContent='連線失敗，請確認網址、金鑰與資料表是否已建立。';msg.className='err';setSyncDot('err');}};
  }
  const c=document.getElementById('m-cancel'); if(c)c.onclick=closeModal;
}
document.getElementById('settings-btn').addEventListener('click',()=>openModal('settings'));
document.getElementById('help-btn').addEventListener('click',()=>openModal('help'));

/* ===================== 啟動 ===================== */
(function init(){const d=new Date();calMonth=new Date(d.getFullYear(),d.getMonth(),1);focusTs=todayTs();})();
(async()=>{
  tasks=await Local.get('tasks',[]);
  tags=await Local.get('tags',[]);
  goals=await Local.get('goals',[]);
  moods=await Local.get('moods',{});
  memo=await Local.get('memo',{text:'',upd:0});
  logs=await Local.get('logs',[]);
  timer=await Local.get('timer',null);
  soundOn=await Local.get('sound',true);
  Cloud.cfg=await Local.get('settings',{url:'',key:''});
  await applyTheme(await Local.get('theme','light'));
  if(migrate()){await Local.set('tasks',tasks);await Local.set('tags',tags);await Local.set('goals',goals);}
  renderQuick(); render();
  if(Cloud.enabled)fullSync();
  if(!(await Local.get('seen-help-3',false))){ setTimeout(()=>openModal('help'),400); await Local.set('seen-help-3',true); }
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
